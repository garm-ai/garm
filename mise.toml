# Toolchain and tasks for garm. `mise install` gets you a working checkout;
# `mise run ci` is exactly what CI runs.
#
# mise is the task runner as well as the toolchain manager, deliberately: a
# second tool for `build` and `test` would be a second config file in every
# repository, and the value here is that `mise run test` means the same thing
# in all of them.

[tools]
go = "1.26"
# buf is here for the CLI to SHELL OUT to, not for this repository's own build.
# `garm gen` runs `buf generate` in a consumer's tree, and internal/plugin
# exists so that a consumer's buf.gen.yaml can name this binary as a local
# plugin. Nothing here is generated by buf any more — the protos went with the
# contract — so there is no `gen` task and no buf.yaml. The dependency now runs
# outwards: garm drives buf over somebody else's protos.
buf = "1"

[tasks.build]
description = "Build every package"
run = "go build ./..."

[tasks.test]
description = "Run the tests"
# Two of these read a github.com/garm-ai/contracts checkout, because their
# subject is the contract's source rather than its compiled Go. They skip when
# there is none and fail when CI is set; see internal/contractsrepo.
run = "go test ./... -race -count=1"

[tasks.bench]
description = "Measure what a catalogue costs to build, load and hold"
# -benchtime=1x because these measure a one-shot cost, not throughput: nobody
# loads a catalogue in a hot loop, and repeating it only measures a warm cache.
run = "go test ./cmd/garm/ -bench=Catalogue -benchtime=1x -run=XXX"

[tasks.lint]
description = "Vet the Go"
# No `buf lint`. The protos this used to lint are garm-ai/contracts' now, and
# that repository lints them; linting a copy here would mean there was a copy.
run = "go vet ./..."

[tasks.fmt]
description = "Format Go"
run = "go fmt ./..."

[tasks."fmt-check"]
description = "Fail if anything is unformatted"
run = """
out=$(gofmt -l .)
if [ -n "$out" ]; then
  echo "unformatted — run 'mise run fmt':" >&2
  echo "$out" >&2
  exit 1
fi
echo "ok: formatted"
"""

[tasks."contract-is-a-dependency"]
description = "Fail if the contract has been vendored, forked or replaced"
# The invariant the split creates, as a check rather than a convention.
#
# The contract is github.com/garm-ai/contracts at a released tag. The two ways
# that quietly stops being true are a `replace` pointing at a local checkout —
# invisible to anyone who installs this binary, and the version everyone else
# builds against then differs from the one the author tested — and a copy of
# the tree reappearing here under its old names, which is where the drift this
# split exists to end would start again.
#
# A vendor/ directory counts: it is the supported way to fork a dependency
# without saying so.
run = """
fail=0
if grep -Eq '^\\s*replace\\s' go.mod; then
  echo "go.mod carries a replace directive; the contract must be a released tag" >&2
  fail=1
fi
for d in contracts policy proto vendor; do
  if [ -e "$d" ]; then
    echo "$d/ exists; the contract is a dependency and must not be copied here" >&2
    fail=1
  fi
done
if ! grep -q 'github.com/garm-ai/contracts v' go.mod; then
  echo "go.mod does not require github.com/garm-ai/contracts" >&2
  fail=1
fi
[ "$fail" = 0 ] || exit 1
echo "ok: the contract is a dependency at a released tag"
"""

[tasks."tidy-check"]
description = "Fail if go.mod or go.sum is not tidy"
run = """
go mod tidy -diff || { echo "not tidy: run 'go mod tidy'" >&2; exit 1; }
echo "ok: go.mod and go.sum are tidy"
"""

[tasks.ci]
description = "Everything CI runs"
depends = ["fmt-check", "lint", "build", "test", "contract-is-a-dependency", "tidy-check"]
