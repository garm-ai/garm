# Toolchain and tasks for garm. `mise install` gets you a working checkout;
# `mise run ci` is exactly what CI runs.
#
# mise is the task runner as well as the toolchain manager, deliberately: a
# second tool for `build` and `test` would be a second config file in every
# repository, and the value here is that `mise run test` means the same thing
# in all of them.

[tools]
go = "1.26"
buf = "1"

[tasks.gen]
description = "Regenerate the contract and the test fixtures"
run = [
  "buf generate",
  "buf generate --template buf.gen.testdata.yaml",
]

[tasks.build]
description = "Build every package"
run = "go build ./..."

[tasks.test]
description = "Run the tests"
run = "go test ./... -race -count=1"

[tasks.bench]
description = "Measure what a catalogue costs to build, load and hold"
# -benchtime=1x because these measure a one-shot cost, not throughput: nobody
# loads a catalogue in a hot loop, and repeating it only measures a warm cache.
run = "go test ./cmd/garm/ -bench=Catalogue -benchtime=1x -run=XXX"

[tasks.lint]
description = "Lint the protos and vet the Go"
run = ["buf lint", "go vet ./..."]

[tasks.fmt]
description = "Format Go and protos"
run = ["go fmt ./...", "buf format -w"]

[tasks."gen-check"]
description = "Fail if the generated tree is stale"
# Scoped to the generated paths on purpose. Checking the whole tree would
# fail on any unrelated edit in the working directory, which is right in CI
# and misleading everywhere else — and a check that cries wolf locally is a
# check people stop running before they push.
#
# contracts/garm, not contracts. buf writes with `out: contracts` but only
# ever into contracts/garm; the siblings — ledger, wire, callctx, audit — are
# hand-written Go. Watching the parent meant any uncommitted edit to one of
# those failed with "generated output is stale", which sends whoever reads it
# looking for a generator that was never involved.
run = """
mise run gen
if ! git diff --quiet -- contracts/garm policy/testdata; then
  echo "generated output is stale — run 'mise run gen' and commit:" >&2
  git diff --stat -- contracts/garm policy/testdata >&2
  exit 1
fi
"""

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "build", "test", "gen-check"]
