# CI for garm.
#
# What this repository guarantees is enforced by tests and by the generator,
# not by convention: a schema that declares governance the build cannot honour
# must not compile, nothing here may depend on the daemon, and the contract is
# a dependency rather than a copy. All three are checks, not comments.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Two checks read the contract's SOURCE rather than the module this
      # repository compiles against: the platform's own protos against this
      # linter, and connect-go's real output against ConnectNames. A linked
      # descriptor carries no proto text and this module imports no generated
      # connect package, so the dependency cannot answer either. They skip when
      # there is no checkout and FAIL when CI is set, which is why this step
      # exists and why GARM_CONTRACTS_DIR is set below.
      - uses: actions/checkout@v5
        with:
          repository: garm-ai/contracts
          path: .contracts

      - run: echo "GARM_CONTRACTS_DIR=$GITHUB_WORKSPACE/.contracts" >> "$GITHUB_ENV"

      # mise provides both the toolchain and the tasks, so CI runs the same
      # commands a contributor does. A CI job that reimplements the build is
      # one that drifts from it.
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - run: mise run fmt-check
      - run: mise run lint
      - run: mise run build

      # -race because the plan cache is shared across concurrent requests by
      # design, and a data race there is a governance bug rather than a flake.
      - run: mise run test

      # The invariant the contract's extraction created: a released tag, never
      # a replace, a vendor directory or a copy of the tree.
      - run: mise run contract-is-a-dependency
      - run: mise run tidy-check

  # The property this repository exists to hold: an engineer authoring a tool
  # schema must never need the daemon. Asserted, because a single careless
  # import would end it silently.
  #
  # The contract module is checked the other way round: it must be REACHED, and
  # must not reach back. `go list -deps` walks the real graph, so a cycle
  # through github.com/garm-ai/garm would show up here.
  no-daemon-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: no module may reach garmd
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/garmd|/toolplane'; then
            echo "::error::a package here reaches the daemon; see CLAUDE.md" >&2
            exit 1
          fi
          echo "clean: nothing here depends on garmd"
      - name: the contract is reached and does not reach back
        run: |
          if ! go list -deps ./... | grep -q '^github.com/garm-ai/contracts'; then
            echo "::error::nothing here imports the contract; it should be a dependency" >&2
            exit 1
          fi
          # `go mod graph` rather than `go list -deps` over the contract's own
          # packages. That would be the more direct question, and it cannot be
          # asked: this module imports some of the contract's packages and not
          # others, so go list fails on the ones whose dependencies are absent
          # from this go.sum and the check becomes vacuous — it passes because
          # it listed nothing, not because there was no cycle. The module graph
          # is always complete.
          if go mod graph \
               | grep -Eq '^github\.com/garm-ai/contracts@[^ ]+ github\.com/garm-ai/garm@'; then
            echo "::error::the contract module requires this one; that is a cycle" >&2
            exit 1
          fi
          echo "clean: the contract is a dependency, with no cycle"
