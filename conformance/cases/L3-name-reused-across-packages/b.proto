syntax = "proto3";
package conformance.l3b;
import "garm/tool/v1/tool.proto";
option go_package = "example.com/conformance/l3b;l3b";

message In {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { mask: {} } };
  string id = 1;
}
message Out {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { mask: {} } };
  string status = 1;
}
service B {
  rpc Get(In) returns (Out) {
    option (garm.tool.v1.tool) = {
      name: "get_status" title: "Get status" description: "Read a status."
      verb: VERB_READ min_clearance: CLEARANCE_PUBLIC
    };
  }
}
