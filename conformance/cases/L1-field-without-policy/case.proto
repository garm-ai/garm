syntax = "proto3";
package conformance.l1;
import "garm/tool/v1/tool.proto";
option go_package = "example.com/conformance/l1;c";

message In {
  string id = 1;
}
message Out {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { mask: {} } };
  string id = 1;
}
service S {
  rpc Go(In) returns (Out) {
    option (garm.tool.v1.tool) = {
      name: "go" title: "Go" description: "A field with no policy at all."
      verb: VERB_READ min_clearance: CLEARANCE_PUBLIC
    };
  }
}
