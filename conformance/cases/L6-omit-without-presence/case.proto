syntax = "proto3";
package conformance.l6;
import "garm/tool/v1/tool.proto";
option go_package = "example.com/conformance/l6;c";

message In {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { omit: {} } };
  double a = 1;
}
message Out {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { omit: {} } };
  optional string note = 1;
}
service S {
  rpc Go(In) returns (Out) {
    option (garm.tool.v1.tool) = {
      name: "go" title: "Go" description: "Omit on a presence-less scalar."
      verb: VERB_READ min_clearance: CLEARANCE_PUBLIC
    };
  }
}
