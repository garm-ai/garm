syntax = "proto3";
package conformance.a5;
import "garm/agent/v1/agent.proto";
import "garm/tool/v1/tool.proto";
option go_package = "example.com/conformance/a5;c";
option (garm.tool.v1.tool_sets) = { declared: [{ name: "support" description: "Support desk." }] };

message Ask {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { omit: {} } };
  optional string question = 1;
}

// GetRun is labelled more loosely than Invoke. garmd runs step 2 against these
// labels and nothing else, so the people who can read a run's result — the
// agent's output, derived from every tool the run touched — are a larger set
// than the people who could have started one.
service Assistant {
  option (garm.agent.v1.agent) = {
    mode: MODE_REACT
    principal: { clearance: CLEARANCE_INTERNAL }
    model: { alias: "fast" }
    bounds: { max_steps: 8 max_tokens: 100000 max_tool_calls: 20 timeout: { seconds: 600 } }
    prompts: { key: "system" value: { path: "prompts/system.md" sha256: "d43a2fec89c3b32917f3550b916cc6751f6d326e25f9aa19089cf70dbfd2615a" } }
  };
  rpc Invoke(Ask) returns (garm.agent.v1.RunRef) {
    option (garm.tool.v1.tool) = {
      name: "assistant" title: "Assistant" description: "Start a run."
      verb: VERB_WRITE min_clearance: CLEARANCE_INTERNAL sets: ["support"]
    };
  }
  rpc GetRun(garm.agent.v1.RunRef) returns (garm.agent.v1.RunStatus) {
    option (garm.tool.v1.tool) = {
      name: "assistant_run" title: "Assistant run" description: "Read a run."
      verb: VERB_READ min_clearance: CLEARANCE_PUBLIC sets: ["support"]
    };
  }
}
