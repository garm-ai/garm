// The card vocabulary: what an inbox renders for one viewer at one moment,
// and the template an author may declare beside a tool or an agent.
//
// A new package rather than a field on garm.tool.v1, because garmd must stay
// card-blind: it projects a tool's typed request and response field by field
// and never reads a template. The extension numbers are outside the
// 50001-50005 block garm.tool.v1 owns and the 50101 garm.agent.v1 owns, so
// the vocabularies can never collide.
//
// Enum values are deliberately unprefixed (TASK, OPEN, SUBTLE) rather than
// buf's KIND_TASK convention: a card crosses the wire as protojson with enums
// as strings, and the JSON shape — "kind": "TASK" — is the contract with the
// renderer. buf.yaml excuses this file from those two rules for that reason.
syntax = "proto3";
package garm.card.v1;
option go_package = "github.com/garm-ai/garm/contracts/garm/card/v1;cardv1";

import "google/protobuf/descriptor.proto";

// A Card is a projection of one object — a task, a run, or an agent's
// input — rendered for ONE viewer at ONE moment. It is built by agentd or
// a tool handler, validated at render time (§7), and crosses the policy
// chain like any other response on the governed door.
message Card {
  Kind             kind       = 1;   // START | TASK | RUN
  string           subject_id = 2;   // agent name, task id, or run id
  string           title      = 3;
  State            state      = 4;   // see 1.2
  repeated Element body       = 5;
  repeated Action  actions    = 6;   // empty unless state == OPEN
  Disclosure       disclosure = 7;   // what was withheld from THIS viewer
  repeated CardRef refs       = 8;   // pointers to other cards, never copies
  string           catalogue_digest = 9;
}

enum Kind  { KIND_UNSPECIFIED = 0; START = 1; TASK = 2; RUN = 3; }
enum State { STATE_UNSPECIFIED = 0; OPEN = 1; ANSWERED = 2; EXPIRED = 3; RUNNING = 4; COMPLETED = 5; FAILED = 6; }

message CardRef { Kind kind = 1; string subject_id = 2; string title = 3; State state = 4; }

message Element {
  oneof of {
    Text    text    = 1;
    FactSet facts   = 2;
    Divider divider = 3;
    Input   input   = 4;
    Section section = 5;   // a titled group of elements; one level, never nested (1.3)
  }
}

message Text    { string text = 1; Emphasis emphasis = 2; }
enum Emphasis   { DEFAULT = 0; HEADING = 1; SUBTLE = 2; }
message FactSet { repeated Fact facts = 1; }
message Fact    { string label = 1; string value = 2; }
message Divider {}
message Section { string title = 1; repeated Element elements = 2; }

message Input {
  string id       = 1;   // MUST name a field of the decision message (§3.4 C2)
  string label    = 2;
  bool   required = 3;
  oneof kind {
    TextInput   text   = 4;
    NumberInput number = 5;
    DateInput   date   = 6;
    ToggleInput toggle = 7;
    ChoiceInput choice = 8;
  }
}
message TextInput   { uint32 max_len = 1; bool multiline = 2; }
message NumberInput { double min = 1; double max = 2; }
message DateInput   {}
message ToggleInput {}
message ChoiceInput {
  repeated Choice choices = 1;   // a closed list, or
  Query           query   = 2;   // a governed lookup (§4)
  bool            multi   = 3;
}
message Choice { string title = 1; string value = 2; }

// Executes as the VIEWER, bound to the task the card is about (§4).
message Query {
  string tool      = 1;   // fully-qualified tool name, in THIS contract, unary, VERB_READ
  uint32 min_chars = 2;
  uint32 page_size = 3;
}

message Action {
  string id    = 1;      // "approve" | "decline" for TASK; "start" for START
  string label = 2;
  Style  style = 3;
  oneof kind { Submit submit = 4; }
}
enum Style { STYLE_DEFAULT = 0; POSITIVE = 1; DESTRUCTIVE = 2; }
message Submit { string confirm_text = 1; }

// The viewer's copy of tools-server §5.5: which fields were withheld from
// them, by name, never by value.
message Disclosure { repeated string withheld_fields = 1; }

// Declared cards (design §3.2). A template is read by agentd from the
// catalogue generation a task or run pinned; garmd never reads it.
//
//   result_card  on an agent service: renders the run's result. Until agents
//                declare an output type, a result card may carry literal
//                text only — lint C1 refuses a {field} reference.
//   task_card    on a MODE_GRANT tool: adds context to the open task card.
//                A {field} reference names one of the tool's
//                approval.material_fields, and nothing else (lint C1).
//   card_role    on a query's response fields (§4). Declared here; nothing
//                reads it in this release.
extend google.protobuf.ServiceOptions { Template result_card = 50201; }   // on an agent service
extend google.protobuf.MethodOptions  { Template task_card   = 50202; }   // on a MODE_GRANT tool
extend google.protobuf.FieldOptions   { CardRole  card_role  = 50203; }   // on a query's response fields (§4)

message Template {
  string title = 1;                 // may reference fields: "Payment {reference}"
  repeated TemplateElement body = 2;
  string context = 3;               // optional: a context RPC in this package (§3.3); fields as context.<name>
}
message TemplateElement {
  oneof of {
    string  text    = 1;            // literal, with {field} references
    Facts   facts   = 2;            // fields by name, in this order, with labels
    Divider divider = 3;
    TemplateSection section = 4;
  }
}
message Facts { repeated FactRef facts = 1; }
message FactRef { string field = 1; string label = 2; }
message TemplateSection { string title = 1; repeated TemplateElement elements = 2; }
enum CardRole { CARD_ROLE_UNSPECIFIED = 0; CARD_ROLE_TITLE = 1; CARD_ROLE_VALUE = 2; }
